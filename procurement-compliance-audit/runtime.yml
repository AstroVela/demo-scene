version: 1
# RapidOCR runs in isolated Ray workers; the relation pipeline is unchanged.
runner: ray
output_dir: output

# PostgreSQL stores project, supplier, score, and evidence metadata.
postgres:
  dsn: postgresql://vane_insight:vane_insight_dev_password@127.0.0.1:5432/vane_insight
  raw_schema: procurement_audit_raw
  project_table: projects
  supplier_table: suppliers
  score_table: expert_scores
  evidence_table: evidence_files

# MinIO stores the evidence images referenced by PostgreSQL locators.
minio:
  endpoint: 127.0.0.1:9000
  access_key: vaneinsight
  secret_key: vaneinsight_dev_password
  secure: false
  bucket: procurement-compliance-audit-fixtures

# OCR qualifies evidence before it is sent to the multimodal model.
ocr:
  engine: rapidocr
  device: cpu
  minimum_confidence: 0.60

# The OpenAI-compatible endpoint extracts structured compliance facts.
ai:
  provider: openai
  base_url: http://127.0.0.1:8001/v1
  health_url: http://127.0.0.1:8001/health
  api_key: dummy
  model: Qwen2.5-VL-3B-Instruct
  concurrency: 1
  timeout_seconds: 120.0
  temperature: 0.0
  max_tokens: 512
