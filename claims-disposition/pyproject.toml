[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-disposition-pipeline"
version = "0.1.0"
description = "Standalone Vane SQL claims disposition demo pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "minio>=7.2,<8",
  "numpy>=2,<3",
  "onnxruntime>=1.21,<2",
  "openai==2.45.0",
  "pillow>=12,<13",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<22",
  "pyyaml>=6,<7",
  "pytz>=2026.2,<2027",
  "rapidocr>=3,<4",
  "vane-ai==0.1.0.dev20260714234347",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_disposition_sql_pipeline = [
  "assets/*.jpg",
  "assets/*.txt",
  "sql/staging/*.sql",
  "sql/intermediate/*.sql",
  "sql/marts/*.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
