[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vane-claims-evidence-graph-demo"
version = "0.1.0.dev20260617"
description = "Reproducible claims evidence graph POC built on Vane relations."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Vane Claims POC" },
]
dependencies = [
  "vane-ai[all]==0.1.0.dev20260714234347",
  "pillow==12.2.0",
  "pydantic==2.13.4",
  "openai==2.43.0",
  "socksio==1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]
qwen = [
  "torch",
  "accelerate",
  "transformers>=4.49.0",
  "qwen-vl-utils>=0.0.8",
  "huggingface-hub",
]

[project.scripts]
claims-evidence-graph = "claims_evidence_graph_pipeline.cli:main"
claims-evidence-graph-quality-fixtures = "claims_evidence_graph_pipeline.quality_fixtures_cli:main"
claims-qwen-openai-server = "claims_evidence_graph_pipeline.qwen_openai_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_evidence_graph_pipeline = ["README.md"]
