version: 1
# This is the checked-in EXAMPLE only. Copy it to a local runtime.yml and
# fill in your own endpoints and credentials; runtime.yml is git-ignored:
#
#   cp runtime.example.yml runtime.yml
#
# Switch between Local and Ray without changing the relation pipeline.
runner: local

# MinIO stores the synthetic call recordings and receives the analysis JSON.
minio:
  endpoint: 127.0.0.1:9000
  access_key: your-minio-access-key
  secret_key: your-minio-secret-key
  secure: false
  bucket: customer-service-audit-fixtures
  recordings_prefix: recordings/
  analysis_prefix: analysis/

# Two ASR engines are supported:
#   engine: openai-audio    — POST audio to an OpenAI-compatible
#                             /audio/transcriptions endpoint (no local model,
#                             no Hugging Face access needed). Configure
#                             model/base_url/api_key/language/timeout_seconds.
#   engine: faster-whisper  — local CTranslate2 inference. Configure
#                             model (a Hub id like "small" or a local
#                             directory), device/compute_type/beam_size.
asr:
  engine: openai-audio
  model: qwen-asr
  base_url: https://your-model-gateway.example.com/api
  api_key: your-asr-api-key
  language: zh
  timeout_seconds: 120.0
  min_text_chars: 8

# The OpenAI-compatible endpoint extracts call metrics from transcripts.
# Vane 0.1.0 no longer accepts an inline api_key; the demo exports this
# value as OPENAI_API_KEY for the OpenAI SDK before prompting.
ai:
  provider: openai
  base_url: http://127.0.0.1:8001/v1
  health_url: http://127.0.0.1:8001/health
  api_key: your-ai-api-key
  model: Qwen2.5-VL-3B-Instruct
  concurrency: 1
  timeout_seconds: 120.0
  temperature: 0.0
  max_tokens: 1024
