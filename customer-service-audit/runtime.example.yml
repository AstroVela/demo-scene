version: 1
# This is the checked-in EXAMPLE only. Copy it to a local runtime.yml and
# fill in your own endpoints and credentials; runtime.yml is git-ignored:
#
#   cp runtime.example.yml runtime.yml
#
# The values below keep the documented, end-to-end verified execution shape:
# the `ray` Runner with a local faster-whisper model and a loopback OpenAI
# endpoint (see README.md and docs/runbook.md).
#
# Switch between Local and Ray without changing the relation pipeline.
runner: ray

# MinIO stores the synthetic call recordings and receives the analysis JSON.
# These are the local development credentials documented in docs/runbook.md.
minio:
  endpoint: 127.0.0.1:9000
  access_key: vaneinsight
  secret_key: vaneinsight_dev_password
  secure: false
  bucket: customer-service-audit-fixtures
  recordings_prefix: recordings/
  analysis_prefix: analysis/

# faster-whisper transcribes each recording on CPU (deterministic, int8).
#
# Alternative: `engine: openai-audio` POSTs audio to an OpenAI-compatible
# /audio/transcriptions gateway instead of downloading a local model; then
# replace the keys below with model/base_url/api_key/language/timeout_seconds.
asr:
  engine: faster-whisper
  model: small
  device: cpu
  compute_type: int8
  language: zh
  beam_size: 5
  min_text_chars: 8

# The OpenAI-compatible endpoint extracts call metrics from transcripts.
# Vane 0.1.0 no longer accepts an inline api_key; the demo exports this
# value as OPENAI_API_KEY for the OpenAI SDK before prompting. Remote
# gateways (http or https, any host) are accepted as well; keep real
# api_key values out of Git.
ai:
  provider: openai
  base_url: http://127.0.0.1:8001/v1
  health_url: http://127.0.0.1:8001/health
  api_key: dummy
  model: Qwen2.5-VL-3B-Instruct
  concurrency: 1
  timeout_seconds: 120.0
  temperature: 0.0
  max_tokens: 1024
