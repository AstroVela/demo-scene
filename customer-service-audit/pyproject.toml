[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-service-audit-pipeline"
version = "0.1.0"
description = "Standalone Vane SQL customer service call audit demo pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.1,<2",
  "minio>=7.2,<8",
  "openai==2.45.0",
  "pyarrow>=18,<22",
  "pyyaml>=6,<7",
  "pytz>=2026.2,<2027",
  "socksio==1.0.0",
  "vane-ai[openai]==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_service_audit = [
  "assets/*.wav",
  "assets/*.txt",
  "sql/staging/*.sql",
  "sql/intermediate/*.sql",
  "sql/marts/*.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
